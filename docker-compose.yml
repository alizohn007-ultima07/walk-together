services:
  db:
    image: postgres:16-alpine
    container_name: walks_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-walks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walks}
      POSTGRES_DB: ${POSTGRES_DB:-walks}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walks} -d ${POSTGRES_DB:-walks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: walks_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: walks_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-walks}:${POSTGRES_PASSWORD:-walks}@db:5432/${POSTGRES_DB:-walks}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost,https://localhost,capacitor://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    container_name: walks_frontend
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules: